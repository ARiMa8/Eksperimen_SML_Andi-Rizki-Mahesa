name: Credit Scoring Preprocessing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.6.0 joblib==1.4.2

      - name: Run automated preprocessing
        run: |
          python preprocessing/automate_Andi_Rizki_Mahesa.py \
            --input credit_scoring_raw/credit_g.csv \
            --output preprocessing/credit_scoring_preprocessing

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-scoring-preprocessed
          path: preprocessing/credit_scoring_preprocessing/
